<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signal Intel</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:#ffffff; color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  /* Five feature-card tiles, one per colour family, each its exact product-card gradient. */
  .art { position:absolute; top:24px; left:456px; display:grid; grid-template-columns:repeat(5, 88px); gap:8px; align-items:end; height:240px; }
  .tile { border-radius:24px; }
  .pool { height:240px; background:var(--gradient-product-card-pool); }
  .mint { height:200px; background:var(--gradient-product-card-mint); }
  .grass { height:160px; background:var(--gradient-product-card-grass); }
  .mustard { height:120px; background:var(--gradient-product-card-mustard); }
  .lava { height:80px; background:var(--gradient-product-card-lava); }
  .words { position:absolute; left:32px; bottom:24px; max-width:400px; }
  .name { margin:0; font-size:96px; line-height:.95; font-weight:500; letter-spacing:-.03em; color:#1f2023; }
  .tag { margin:8px 0 0 4px; font-size:14px; line-height:20px; color:#515151; }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
  <div class="tile pool"></div>
  <div class="tile mint"></div>
  <div class="tile grass"></div>
  <div class="tile mustard"></div>
  <div class="tile lava"></div>
</div>
<div class="words">
<h1 class="name">Signal<br>Intel</h1>
<p class="tag">Every claim has a receipt.</p>
</div>
</div>
</body>
</html>
