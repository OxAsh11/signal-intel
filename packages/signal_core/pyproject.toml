[project]
name = "signal-core"
version = "0.1.0"
description = "Shared core for Signal Intel Python services: db, jobs, automation gate, outbox, AI gateway, modules M2-M18."
requires-python = ">=3.13,<3.14"
dependencies = [
    "procrastinate==3.10.0",
    "anthropic==2.3.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "structlog>=25",
    "voyageai==0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_core"]
