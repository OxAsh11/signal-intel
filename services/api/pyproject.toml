[project]
name = "api"
version = "0.1.0"
description = "Signal Intel external REST API: FastAPI /v1, token auth, scope enforcement, read endpoints."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.1",
    "pydantic>=2.7",
    "httpx>=0.27",
    "signal-core",
    "mcp[cli]>=1.0,<2",
]

[project.scripts]
api = "api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
signal-core = { workspace = true }
