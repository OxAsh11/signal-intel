[project]
name = "worker"
version = "0.1.0"
description = "Signal Intel worker: Procrastinate jobs, schedules, outbox relay, health endpoint."
requires-python = ">=3.13,<3.14"
dependencies = ["signal-core"]

[project.scripts]
worker = "worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.uv.sources]
signal-core = { workspace = true }
