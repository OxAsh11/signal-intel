name: Migrate production

# Runs when a release is published. The `production` environment requires a reviewer's approval.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF_PROD }}"
      - name: Show pending migrations
        run: supabase migration list
      - run: supabase db push
