name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, types, tests, build, migration smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # db:check also prepares every SQL statement in the Python code, which it extracts with uv.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --frozen
      - run: pnpm codegen:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:check
      - run: pnpm build

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --frozen
      # The end-to-end pipeline test runs against an in-memory Postgres started with node.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  database:
    name: Database (Supabase + pgTAP)
    runs-on: ubuntu-latest
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci
      SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID: ci
      SUPABASE_AUTH_EXTERNAL_AZURE_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Start Postgres + Auth only
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,storage-api,supavisor,postgres-meta
      - name: Apply migrations and seed from scratch
        run: supabase db reset
      - name: pgTAP
        run: supabase test db

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    env:
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci
      SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID: ci
      SUPABASE_AUTH_EXTERNAL_AZURE_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      # Postgres, Auth, the REST API and Storage (CSV uploads): what the web app talks to.
      # Migrations and seed apply on start.
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,supavisor,postgres-meta
      - name: Point the app and the tests at it
        run: |
          eval "$(supabase status -o env)"
          {
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_ANON_KEY=$ANON_KEY"
            echo "E2E_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_DB_URL=$DB_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3100"
          } >> "$GITHUB_ENV"
      - run: pnpm turbo run build --filter=web
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Playwright
        run: |
          set -o pipefail
          pnpm --filter web e2e 2>&1 | tee e2e.log
      # The server's own errors fail the job too (e.g. Next.js refusing a prerender).
      - name: No server errors during the run
        run: |
          if grep -E "\[WebServer\].*(Error:|unstable value)" e2e.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
      # The Brief page on desktop and phone, to look at on every run (e2e/brief.spec.ts).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brief-screens
          path: apps/web/test-results/brief-*.png
          if-no-files-found: warn
          retention-days: 14
